name: CI

# Cost: this repository is public, and GitHub Actions is free for public repositories on the
# standard GitHub-hosted runners used here, so these jobs consume no paid minutes. The guards
# below keep usage small anyway, and would matter if the repository were ever made private
# (2,000 free minutes a month): nothing runs for documentation-only changes, a newer push to a
# pull request cancels the run it supersedes, and every job has a hard time limit (GitHub's
# default is 6 hours).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

# A newer push to a pull request cancels the run it supersedes. A run on main is never cancelled:
# every commit on main gets a complete verification. Pull requests are grouped by number, so a run
# that GitHub creates late for an already merged pull request cannot share a group with main.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Shell script syntax
        run: for f in setup.sh experiments/env.sh corpus/vm/*.sh corpus/vm/scenarios/*.sh corpus/vm/init; do sh -n "$f"; done

      - name: Restore sandbox.img fixture
        run: zstd -dc tests/fixtures/sandbox.img.zst > sandbox.img && sha256sum -c tests/fixtures/SHA256SUMS

      - name: Tests
        run: uv run pytest

      - name: Legacy tests (original runner)
        run: uv run python -m unittest discover -s legacy/tests

      - name: CLI smoke
        run: uv run btrfska --help

  # A fresh clone on a clean machine: ./setup.sh builds the environment, restores sandbox.img,
  # builds every test image in a KVM guest and runs the whole suite, vm tests included.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Allow the runner user to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # btrfs-progs is only the dump-tree oracle of a few vm tests; images are made by the pinned mkfs
      - name: Install QEMU and the dump-tree oracle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 btrfs-progs

      - name: Cache the pinned guest packages
        uses: actions/cache@v6
        with:
          path: images/vm/debs
          key: guest-debs-${{ hashFiles('corpus/vm/guest.lock') }}

      - name: Set up from a fresh clone
        run: ./setup.sh

      - name: No vm test was skipped for a missing image
        run: uv run pytest -q -m vm -rs | tee vm.log && ! grep -E -q 'absent|no build record' vm.log

