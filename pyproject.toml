[project]
name = "btrfska"
version = "0.0.1"
description = "Read-only forensic reconstruction of filesystem history from raw Btrfs images"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
btrfska = "btrfska.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests", "legacy/tests"]
markers = ["sandbox: needs sandbox.img", "vm: needs corpus/vm images"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
